name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-fixture-password
          MARIADB_DATABASE: ssc_test_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, fileinfo, curl, mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate dependency manifests
        run: |
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node tests/model-smoke.mjs
          git diff --exit-code -- assets/js/siklab-scene.bundle.js
      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: Check release packaging and deployment safeguards
        env:
          SSC_INTEGRATION: '1'
          DB_SERVER: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          DB_USERNAME: root
          DB_PASSWORD: ci-only-fixture-password
          DB_NAME: ssc_test_ci
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_release.py
      - name: Verify PDF dependency
        run: |
          php -r 'require "vendor/autoload.php"; $pdf = new TCPDF(); $pdf->AddPage(); $pdf->Write(0, "CI smoke check"); if (substr($pdf->Output("check.pdf", "S"), 0, 5) !== "%PDF-") { exit(1); }'
